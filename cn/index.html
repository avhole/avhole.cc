<!DOCTYPE html>
<html lang="zh-Hans">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>地址发布</title>
		<link rel="shortcut icon" href="favicon.ico" />
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body>
		<div class="flex justify-center items-center h-screen bg-gray-800">
			<div class="max-w-7xl space-y-8 text-gray-100">
				<div>請收藏本站，最新发布地址，不定期更新</div>
				<div>1. 建议 Ctrl+D / Cmd+D 收藏本页面，永远找到回家的路</div>
				<div>
					<button
						onclick="window.location.href = ('@m@o@c@.@e@l@o@h@v@a@/@/@:@s@p@t@t@h@').split('').reverse().join('').replace(/@/g, '');"
						type="button"
						class="inline-flex items-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:ring-red-500"
					>
						最新地址
					</button>
				</div>
				<div>2. 发送任意消息到邮箱</div>

				<button
					onclick="alert(('$m$o$c$.$e$l$o$h$v$a$@$l$r$u$').split('').reverse().join('').replace(/\$/g, ''));"
					type="button"
					class="inline-flex items-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:ring-red-500"
				>
					点击查看
				</button>
			</div>
		</div>
	</body>
</html>
